<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Devinci Lost & Found — Déclaration d'objet trouvé</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <link rel="stylesheet" href="assets/css/app.css">

    <style>
        .dropzone {
            border: 2px dashed #2F7CF6;
            background: #f0f6ff;
            padding: 30px;
            text-align: center;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .dropzone.dragover {
            background: #dceaff;
            border-color: #1a5edc;
        }
        #preview {
            margin-top: 15px;
            max-width: 300px;
            border-radius: 10px;
            display: none;
        }
        input, button {
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<header>📍 Devinci Lost & Found — Déclarer un objet trouvé</header>

<div class="container">

    <h2>Ajouter un objet trouvé</h2>

    <label>Nom de l’objet</label>
    <input id="title" type="text" placeholder="Ex : Portefeuille, Clés, Casque..." />

    <label>Numéro du trouveur</label>
    <input id="phone" type="text" placeholder="06 XX XX XX XX" />

    <label>Longitude</label>
    <input id="lng" type="text" disabled/>

    <label>Latitude</label>
    <input id="lat" type="text" disabled/>

    <h3>📸 Photo de l’objet</h3>
    <div id="dropzone" class="dropzone">
        Glissez-déposez une image ici<br>
        ou cliquez pour choisir une photo
    </div>
    <img id="preview" />

    <button id="sendBtn" disabled>Envoyer à Omeka S</button>
</div>


<script type="module">
    import { pa } from "./modules/authParams.js";
    import { omk } from "./modules/omk.js";

    const O = new omk({
        api: pa.apiOmk || pa.api,
        ident: pa.ident,
        key: pa.key,
        mail: pa.mail
    });

    let selectedFile = null;

    const dropzone = document.getElementById("dropzone");
    const preview = document.getElementById("preview");
    const sendBtn = document.getElementById("sendBtn");

    // 📌 Unified handle logic
    function handleFile(file) {
        if (!file || !file.type.startsWith("image/")) {
            alert("Veuillez choisir une image valide.");
            return;
        }

        // Guarantee real File with name
        selectedFile = new File([file], file.name || "image.jpg", {
            type: file.type
        });

        preview.src = URL.createObjectURL(selectedFile);
        preview.style.display = "block";

        sendBtn.disabled = false;
    }

    // 📌 Click → open file selector
    dropzone.addEventListener("click", () => {
        let input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = e => handleFile(e.target.files[0]);
        input.click();
    });

    // 📌 Drag & drop behavior
    dropzone.addEventListener("dragover", e => {
        e.preventDefault();
        dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        handleFile(e.dataTransfer.files[0]);
    });

    // 📌 Send to Omeka
    sendBtn.onclick = async () => {
        if (!selectedFile) {
            alert("Aucune image à envoyer.");
            return;
        }

        const title = document.getElementById("title").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const lat = document.getElementById("lat").value;
        const lng = document.getElementById("lng").value;

        if (!title) return alert("Veuillez entrer un nom d’objet.");
        if (!phone) return alert("Veuillez entrer le numéro du trouveur.");

        const desc = 
            `Objet trouvé.\n` +
            `Téléphone du trouveur : ${phone}\n` +
            `Localisation : lat=${lat}, lng=${lng}`;

        const data = {
            "dcterms:title": title,
            "dcterms:description": desc
        };

        try {
            const item = await O.createItem(data);
            if (!item) { alert("Erreur lors de la création."); return; }

            const id = item["o:id"];

            await O.uploadMediaToItem(id, selectedFile);

            alert("Objet envoyé à Omeka S !");
            window.location.reload();

        } catch(e) {
            alert("Erreur Upload : " + e);
        }
    };

    // 📌 Auto geolocation
    navigator.geolocation.getCurrentPosition(
        pos => {
            document.getElementById("lat").value = pos.coords.latitude.toFixed(6);
            document.getElementById("lng").value = pos.coords.longitude.toFixed(6);
        },
        err => console.warn("Geolocation error:", err),
        { enableHighAccuracy: true }
    );

</script>

</body>
</html>
