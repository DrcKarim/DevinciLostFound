<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Devinci Lost & Found — Enregistreur Audio</title>

    <!-- NEW modern CSS -->
    <link rel="stylesheet" href="assets/css/app.css">

    <!-- Required JS -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        .whisper-box {
            margin-top: 40px;
            padding: 20px;
            border-radius: 12px;
            background: #f5f5f5;
        }
        textarea {
            width:100%;
            min-height:150px;
            padding:10px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:15px;
        }
    </style>
</head>

<body>

<header>🎤 Devinci Lost & Found — Enregistrement Audio</header>

<div class="container">

    <h2>Enregistrer un message audio</h2>

    <label>Longitude</label>
    <input id="lng" type="text">

    <label>Latitude</label>
    <input id="lat" type="text">

    <label>Nom du lieu</label>
    <input id="place" type="text">

    <div id="recArea">En attente d’enregistrement…</div>

    <button id="startBtn">Commencer</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="uploadBtn" disabled>Envoyer à Omeka S</button>

    <!-- ⭐ WHISPER TRANSCRIPTION FORM ⭐ -->
    <div class="whisper-box">
        <h3>📝 Transcription du message (Whisper API)</h3>

        <button id="transcribeBtn" disabled>Transcrire l’audio</button>

        <label style="margin-top:10px; display:block;">Texte transcrit</label>
        <textarea id="whisperText" placeholder="La transcription apparaîtra ici..."></textarea>
    </div>

</div>

<!-- JS + MODULES -->
<script src="js/d3.v7.min.js"></script>

<script type="module">
    import { pa } from "./modules/authParams.js";
    import { omk } from "./modules/omk.js";
    import Recorder from "./modules/simpleRecorder.js";

    const O = new omk({
        api: pa.apiOmk || pa.api || false,
        ident: pa.ident || pa.key_identity || false,
        key: pa.key || pa.key_credential || false,
        mail: pa.mail || pa.email || false
    });

    let rec = new Recorder();
    let blobAudio = null;

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const transcribeBtn = document.getElementById("transcribeBtn");
    const whisperText = document.getElementById("whisperText");

    startBtn.onclick = async () => {
        rec.start();
        document.getElementById("recArea").innerText = "🎙️ Enregistrement…";
        startBtn.disabled = true;
        stopBtn.disabled = false;
    };

    stopBtn.onclick = async () => {
        blobAudio = await rec.stop();
        document.getElementById("recArea").innerText = "✔️ Audio enregistré — prêt à envoyer";
        stopBtn.disabled = true;
        uploadBtn.disabled = false;
        transcribeBtn.disabled = false;

        let audioUrl = URL.createObjectURL(blobAudio);
        let prev = document.getElementById('audioPreview');
        if(!prev){
            prev = document.createElement('audio');
            prev.id = 'audioPreview';
            prev.controls = true;
            prev.className = 'w-full mb-4';
            document.getElementById('recArea').insertAdjacentElement('afterend', prev);
        }
        prev.src = audioUrl;
    };

    // ⭐ WHISPER TRANSCRIPTION ⭐
    transcribeBtn.onclick = async () => {
        if (!blobAudio) {
            alert("Aucun audio à transcrire.");
            return;
        }

        whisperText.value = "⏳ Transcription en cours...";

        try {
            // -----------------------------
            // 🔥 CALL WHISPER API HERE
            // -----------------------------
            const fd = new FormData();
            fd.append("file", blobAudio, "audio.webm");
            fd.append("model", "whisper-1");

            const res = await fetch("https://api.openai.com/v1/audio/transcriptions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer VOTRE_API_KEY"
                },
                body: fd
            });

            const json = await res.json();
            whisperText.value = json.text || "Erreur : aucune transcription reçue.";

        } catch (err) {
            whisperText.value = "❌ Erreur lors de la transcription : " + err;
            console.error(err);
        }
    };

    // ⭐ UPLOAD TO OMEKA S ⭐
    uploadBtn.onclick = async () => {
        const meta = {
            "o:resource_template": "Lieu",
            "dcterms:title": document.getElementById("place").value || 'Enregistrement audio',
            "dcterms:description": [
                whisperText.value || "Message audio",
                "Latitude: " + (document.getElementById("lat").value || ''),
                "Longitude: " + (document.getElementById("lng").value || '')
            ].filter(Boolean).join(' | ')
        };

        if(!blobAudio){
            alert('Aucun enregistrement disponible.');
            return;
        }

        try{
            const item = await O.createItem(meta);
            if(!item){ alert("Erreur création item Omeka."); return; }

            const id = item["o:id"];
            await O.uploadMediaToItem(id, blobAudio);
            alert("Audio + texte envoyés à Omeka !");
        }catch(e){
            alert("Erreur upload : " + e);
        }
    };

</script>
<script>
document.addEventListener("DOMContentLoaded", () => {

    // Vérifie si la géolocalisation est supportée
    if (!navigator.geolocation) {
        console.warn("❌ La géolocalisation n'est pas supportée.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);

            document.getElementById("lat").value = lat;
            document.getElementById("lng").value = lng;

            console.log("📍 Position détectée :", lat, lng);
        },
        error => {
            console.warn("⚠️ Erreur géolocalisation :", error.message);
        },
        {
            enableHighAccuracy: true,
            timeout: 5000,
            maximumAge: 0
        }
    );
});
</script>

</body>
</html>
